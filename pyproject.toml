[project]
name = "eve-strait"
version = "0.1.0"
description = "EVE Online capital / jump freighter route planner with ESI auth and a 2D New Eden jump map"
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
    "anthropic>=0.122.0",
    "openai>=3.1.0",
    "PySide6>=6.7",
    "requests>=2.31",
]

[project.scripts]
eve-strait = "eve_strait.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/eve_strait"]
