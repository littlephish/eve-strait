# Flatpak manifest for Eve-Strait.
#
# Compiled with Nuitka, the same as the Windows build. One build tool across
# platforms means one set of packaging bugs to understand, and the compiled
# app starts faster than interpreted source.
#
# Runtime choice, recorded because it is not obvious:
#
#   org.kde.Platform provides Qt6, but expects PySide6 built against exactly
#   that Qt. The PySide6 wheel on PyPI bundles its own Qt, which then fights
#   the runtime's. Using org.freedesktop.Platform with the wheel sidesteps the
#   version-matching problem entirely, at the cost of the bundled Qt's size.
#
# Branch: 25.08 rather than 26.08. 26.08 released in August 2026 and is only a
# couple of patch releases old; 25.08 is at .17, is supported until August
# 2027, and is what the PySide6 wheels and Flathub tooling have had time to
# settle against. 24.08 reached its two-year EOL in August 2026 -- do not use
# it. Bump to 26.08 once it has some mileage.
app-id: io.github.littlephish.EveStrait
runtime: org.freedesktop.Platform
runtime-version: '25.08'
sdk: org.freedesktop.Sdk
command: eve-strait

finish-args:
  # Qt needs a display. Both are listed so Wayland is preferred and X11 works.
  - --socket=wayland
  - --socket=fallback-x11
  - --share=ipc
  - --device=dri
  # Needed for: ESI, the solar-system dump from Fuzzwork on first launch,
  # EVE-Scout, and the OAuth callback this app serves on localhost:8635.
  - --share=network
  # Opening the EVE SSO page in the user's own browser, via the portal.
  - --talk-name=org.freedesktop.portal.OpenURI
  # Credential storage for mapper logins, so a Tripwire password is never
  # written to disk in plaintext. keyring picks SecretService here.
  - --talk-name=org.freedesktop.secrets

modules:
  # Generated, not hand-written. Flathub builds offline, so every dependency
  # must arrive with a hash rather than being resolved during the build. This
  # includes Nuitka itself, which is a build-time dependency here.
  # Regenerate after any change to pyproject.toml -- see README.md.
  - python3-requirements.json

  - name: eve-strait
    buildsystem: simple
    build-commands:
      # Mirrors the Windows invocation in .github/workflows/release.yml, minus
      # the windows-* flags.
      #
      # Deliberately NOT --assume-yes-for-downloads: that flag lets Nuitka
      # fetch ccache and, on some platforms, gcc. In an offline Flathub build
      # that would fail confusingly late. Better to never ask, and to disable
      # the one cache that would otherwise want fetching.
      # PYTHONPATH rather than `pip install .`: the package lives under src/,
      # and installing it would drag in the hatchling build backend, which is
      # not in the offline dependency list and cannot be fetched here.
      - PYTHONPATH=src python3 -m nuitka
        --standalone
        --enable-plugin=pyside6
        --include-package=eve_strait
        --include-package-data=eve_strait
        --disable-cache=ccache
        --company-name=Eve-Strait
        --product-name=Eve-Strait
        --file-description="EVE Online capital jump route planner"
        --copyright=Eve-Strait
        --linux-app-icon=dist_assets/linux/io.github.littlephish.EveStrait.svg
        --output-dir=out
        --output-filename=eve-strait
        app.py
      # The compiled program folder goes under /app/lib; only the launcher
      # belongs on PATH. `command:` above resolves to /app/bin/eve-strait.
      #
      # Globbed rather than assuming out/app.dist: Nuitka names the folder
      # after the main module, and release.yml on Windows already globs for
      # the same reason. Fails loudly if there is no folder or more than one,
      # instead of installing nothing and producing a Flatpak that launches
      # into a missing binary.
      - |
        set -e
        dist=$(ls -d out/*.dist)
        test -d "$dist" || { echo "Nuitka produced no program folder"; exit 1; }
        test -x "$dist/eve-strait" || { echo "no eve-strait binary in $dist"; exit 1; }
        mkdir -p ${FLATPAK_DEST}/lib/eve-strait ${FLATPAK_DEST}/bin
        cp -a "$dist/." ${FLATPAK_DEST}/lib/eve-strait/
        ln -sf ../lib/eve-strait/eve-strait ${FLATPAK_DEST}/bin/eve-strait
      - install -Dm644
        dist_assets/linux/io.github.littlephish.EveStrait.desktop
        ${FLATPAK_DEST}/share/applications/io.github.littlephish.EveStrait.desktop
      - install -Dm644
        dist_assets/linux/io.github.littlephish.EveStrait.metainfo.xml
        ${FLATPAK_DEST}/share/metainfo/io.github.littlephish.EveStrait.metainfo.xml
      - install -Dm644
        dist_assets/linux/io.github.littlephish.EveStrait.svg
        ${FLATPAK_DEST}/share/icons/hicolor/scalable/apps/io.github.littlephish.EveStrait.svg
    sources:
      # Local iteration builds from the working tree. The published manifest
      # points at a tag instead -- see README.md.
      #
      # skip is not optional: a plain `type: dir` copies everything, and this
      # tree carries a 687 MB .venv and a 225 MB dist/ that have no business
      # in a build sandbox.
      - type: dir
        path: ../..
        skip:
          - .venv
          - .git
          - dist
          - out
          - build
          - build-dir
          - .flatpak-builder
          - .pytest_cache
          - __pycache__
          - updater/target
