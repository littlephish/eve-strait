name: Release

# Push a tag to build the Windows, macOS (dmg) and Flatpak artifacts and publish a release:
#
#   git tag v0.1.0
#   git push origin v0.1.0
#
# Tags only, deliberately. A Nuitka compile plus an installer build is minutes
# of CI, and "Read version from the tag" would pick up a branch name on any
# other trigger.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write   # needed to create the GitHub Release

jobs:
  release:
    name: Build and publish Windows artifacts
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Read version from the tag
        id: ver
        shell: pwsh
        run: |
          $v = "${{ github.ref_name }}" -replace '^v',''
          if (-not $v) { $v = "0.0.0" }
          "version=$v" | Out-File $env:GITHUB_OUTPUT -Append

      # Stamp the tag into __init__.py and pyproject BEFORE pip install and
      # before Nuitka. Skipping this is how a v0.2.0 build kept reporting
      # 0.1.0, which made the updater offer an update to the running build.
      - name: Stamp the version
        shell: pwsh
        run: |
          # Read the version back through the same script rather than
          # grepping the file from an inline python -c: the nested quoting
          # needed to match "x.y.z" inside a YAML block scalar does not
          # survive, which is how this step first shipped broken.
          python scripts/version.py ${{ steps.ver.outputs.version }}
          $got = (python scripts/version.py).Trim()
          if ($got -ne "${{ steps.ver.outputs.version }}") {
            throw "stamp failed: file says '$got', tag says '${{ steps.ver.outputs.version }}'"
          }
          Write-Host "stamped OK: $got"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # Nuitka is pinned: it is a compiler, and an unpinned one turns
          # every tag into a build against whatever shipped that week.
          # Bump deliberately, and re-run a release build when you do.
          python -m pip install PySide6 requests keyring nuitka==4.2.1 zstandard ordered-set
          python -m pip install .

      # Keyed on uv.lock, not pyproject.toml: the "Stamp the version" step
      # above rewrites pyproject.toml's version field before this runs, which
      # means every single tagged release hashed to a different key and this
      # cache was never actually being reused release to release -- only
      # ever a same-run coincidence via restore-keys' prefix fallback, and
      # each release was quietly saving its own multi-GB copy of the cache
      # under a key nothing would ever ask for again, which is exactly the
      # kind of thing that fills the repo's cache quota and starts evicting
      # the entries that do matter. uv.lock is never written to during this
      # workflow (pip install ., not uv sync), so its hash is stable across
      # releases that do not actually change a dependency.
      - name: Cache Nuitka compilation cache
        uses: actions/cache@v4
        with:
          path: ~/AppData/Local/Nuitka/Nuitka/Cache
          key: nuitka-${{ runner.os }}-${{ hashFiles('uv.lock') }}
          restore-keys: nuitka-${{ runner.os }}-

      # --standalone, never --onefile: a self-extracting single exe unpacks to
      # %TEMP% and runs itself, which Defender and CrowdStrike flag as dropper
      # behaviour. A plain program folder does not, and it is also what makes
      # the in-app updater possible.
      - name: Build (Nuitka standalone)
        run: >
          python -m nuitka
          --standalone
          --enable-plugin=pyside6
          --include-package=eve_strait
          --include-package=keyring
          --include-package=win32ctypes
          --windows-console-mode=disable
          --assume-yes-for-downloads
          --company-name=Eve-Strait
          --product-name=Eve-Strait
          --file-version=${{ steps.ver.outputs.version }}
          --product-version=${{ steps.ver.outputs.version }}
          --file-description="EVE Online capital jump route planner"
          --copyright=Eve-Strait
          --windows-icon-from-ico=dist_assets/win/eve-strait.ico
          --include-package-data=eve_strait
          --output-dir=out
          --output-filename=eve-strait.exe
          app.py

      - name: Verify the built package reports the tag version
        shell: pwsh
        run: |
          $v = python -c "import eve_strait; print(eve_strait.__version__)"
          if ($v.Trim() -ne "${{ steps.ver.outputs.version }}") {
            throw "version mismatch: package says '$v', tag says '${{ steps.ver.outputs.version }}'"
          }
          Write-Host "version OK: $v"

      # Rust ships on windows-latest, so this needs no toolchain setup step.
      # Fatal if it fails: a published build must carry update.exe, or every
      # install it reaches falls back to the PowerShell path that a machine
      # execution policy can block.
      - name: Build the updater (update.exe)
        shell: pwsh
        run: |
          cargo build --release --manifest-path updater\Cargo.toml
          if ($LASTEXITCODE -ne 0) { throw "cargo build failed" }
          if (-not (Test-Path updater\target\release\update.exe)) {
            throw "cargo reported success but produced no update.exe"
          }

      - name: Stage the program folder
        shell: pwsh
        run: |
          $dist = Get-ChildItem out -Directory -Filter *.dist | Select-Object -First 1
          if (-not $dist) { throw "Nuitka produced no program folder" }
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item $dist.FullName dist\Eve-Strait -Recurse
          Copy-Item updater\target\release\update.exe dist\Eve-Strait -Force

      # The updater looks for a *-win*.zip asset, so keep "win" in the name.
      - name: Zip the portable build
        shell: pwsh
        run: |
          Compress-Archive -Path dist\Eve-Strait `
            -DestinationPath dist\Eve-Strait-${{ steps.ver.outputs.version }}-win64.zip

      - name: Build the installer
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            choco install innosetup -y --no-progress
            # Do not assume where choco put it.
            $iscc = (Get-ChildItem "${env:ProgramFiles(x86)}", $env:ProgramFiles `
                       -Filter ISCC.exe -Recurse -ErrorAction SilentlyContinue |
                     Select-Object -First 1).FullName
          }
          if (-not $iscc) { throw "Inno Setup compiler (ISCC.exe) not found" }
          & $iscc /DAppVersion=${{ steps.ver.outputs.version }} `
            dist_assets\win\eve-strait.iss
          if ($LASTEXITCODE -ne 0) { throw "ISCC failed with $LASTEXITCODE" }

      - name: Show what will be released
        shell: pwsh
        run: Get-ChildItem dist -File | Select-Object Name, Length | Format-Table

      # Published, not a draft. A draft is invisible to anyone not logged in as
      # a maintainer, and the in-app updater reads /releases/latest, which
      # skips drafts and prereleases entirely.
      - uses: softprops/action-gh-release@v2
        with:
          draft: false
          generate_release_notes: true
          files: |
            dist/Eve-Strait-*-win64.zip
            dist/Eve-Strait-*-setup.exe

  # The macOS release: Nuitka .app bundle wrapped in a .dmg. Apple Silicon
  # only (macos-latest is arm64; the Intel runners are being retired).
  # Runs after the Windows job so the release already exists and a mac
  # failure cannot un-ship the Windows installer.
  #
  # Deliberately NOT Apple-signed or notarized (project decision). The app is
  # only ad-hoc signed, so Gatekeeper warns on first launch (right-click >
  # Open). Don't add Developer ID / notarization steps.
  #
  # The in-app updater is check-only on macOS (update.py), and the asset name
  # deliberately has no "win" in it so the Windows updater never picks it up.
  macos:
    name: Build macOS dmg (arm64)
    needs: release
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Read version from the tag
        id: ver
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Stamp the version
        run: |
          python scripts/version.py "${{ steps.ver.outputs.version }}"
          got=$(python scripts/version.py)
          test "$got" = "${{ steps.ver.outputs.version }}" || {
            echo "stamp failed: file says '$got', tag says '${{ steps.ver.outputs.version }}'"; exit 1; }
          echo "stamped OK: $got"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install PySide6 requests keyring nuitka==4.2.1 zstandard ordered-set
          python -m pip install .

      # Build an .icns from the Windows .ico with the tools macOS ships. If
      # it fails the app still builds, just with the default icon.
      - name: Make the app icon
        run: |
          set -x
          mkdir -p build/icon.iconset
          if sips -s format png dist_assets/win/eve-strait.ico --out build/icon.png; then
            for s in 16 32 64 128 256 512; do
              sips -z $s $s build/icon.png --out build/icon.iconset/icon_${s}x${s}.png
              sips -z $((s*2)) $((s*2)) build/icon.png --out build/icon.iconset/icon_${s}x${s}@2x.png
            done
            iconutil -c icns build/icon.iconset -o build/eve-strait.icns || true
          fi
          ls -l build || true

      - name: Cache Nuitka compilation cache
        uses: actions/cache@v4
        with:
          path: ~/Library/Caches/Nuitka
          key: nuitka-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('uv.lock') }}
          restore-keys: nuitka-${{ runner.os }}-${{ runner.arch }}-

      - name: Build (Nuitka .app bundle)
        run: |
          icon_arg=""
          if [ -f build/eve-strait.icns ]; then
            icon_arg="--macos-app-icon=build/eve-strait.icns"
          fi
          python -m nuitka \
            --standalone \
            --macos-create-app-bundle \
            --macos-app-name=Eve-Strait \
            --macos-app-version=${{ steps.ver.outputs.version }} \
            $icon_arg \
            --enable-plugin=pyside6 \
            --include-package=eve_strait \
            --include-package=keyring \
            --include-package-data=eve_strait \
            --assume-yes-for-downloads \
            --output-dir=out \
            --output-filename=eve-strait \
            app.py
          ls out

      - name: Verify the built package reports the tag version
        run: |
          v=$(python -c "import eve_strait; print(eve_strait.__version__)")
          test "$v" = "${{ steps.ver.outputs.version }}" || { echo "version mismatch: '$v'"; exit 1; }

      # Apple Silicon refuses to run unsigned code, so ad-hoc sign at minimum.
      - name: Ad-hoc sign and check the bundle
        run: |
          app=$(ls -d out/*.app | head -n1)
          test -d "$app" || { echo "Nuitka produced no .app"; exit 1; }
          codesign --force --deep --sign - "$app"
          codesign --verify --deep --strict "$app"
          echo "APP=$app" >> "$GITHUB_ENV"

      - name: Create the dmg
        run: |
          mkdir -p dist dmgroot
          cp -R "$APP" dmgroot/Eve-Strait.app
          ln -s /Applications dmgroot/Applications
          hdiutil create -volname "Eve-Strait ${{ steps.ver.outputs.version }}" \
            -srcfolder dmgroot -ov -format UDZO \
            "dist/Eve-Strait-${{ steps.ver.outputs.version }}-macos-arm64.dmg"
          ls -l dist

      - uses: actions/upload-artifact@v4
        with:
          name: Eve-Strait-macos-arm64-dmg
          path: dist/*.dmg

      # generate_release_notes stays off: the Windows job already wrote them.
      - name: Attach the dmg to the release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/Eve-Strait-*-macos-arm64.dmg

  # The Linux release: the same tag, a different machine. Runs after the
  # Windows job on purpose, so the release exists first and the bundle is
  # attached to it rather than creating a second one -- and a Flatpak
  # failure cannot un-ship the Windows installer, which is already attached
  # by the time this job starts.
  flatpak:
    name: Build Flatpak (x86_64)
    needs: release
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:freedesktop-25.08
      options: --privileged
    steps:
      - uses: actions/checkout@v4

      # Same stamp as the Windows job: the tag is the version, and the build
      # compiles whatever is in the source tree. Run it with the Sdk's
      # python3, not the container's -- the container image is not
      # guaranteed to carry a host python, and the Sdk is the interpreter
      # that actually compiles the app.
      - name: Stamp the version
        run: |
          v="${GITHUB_REF_NAME#v}"
          # flatpak run starts in the sandbox's home, not the checkout, so a
          # relative script path resolves to nothing and python3 exits 2 with
          # "can't open file" -- the first v0.6.2 build died exactly there.
          # Address the script absolutely and expose the workspace
          # read-write, because version.py rewrites two files in it.
          stamp() {
            flatpak run --command=python3 --filesystem="$GITHUB_WORKSPACE" \
              org.freedesktop.Sdk//25.08 "$GITHUB_WORKSPACE/scripts/version.py" "$@"
          }
          if ! stamp "$v"; then
            echo "--- installed flatpak refs:"; flatpak list || true
            exit 1
          fi
          got=$(stamp)
          test "$got" = "$v" || { echo "stamp failed: file says '$got', tag says '$v'"; exit 1; }
          echo "stamped OK: $got"

      - uses: flatpak/flatpak-github-actions/flatpak-builder@v6
        with:
          bundle: eve-strait.flatpak
          manifest-path: dist_assets/linux/io.github.littlephish.EveStrait.yml
          cache-key: flatpak-release-${{ github.sha }}
          upload-artifact: true

      # generate_release_notes stays off: the Windows job already wrote them.
      - name: Attach the bundle to the release
        uses: softprops/action-gh-release@v2
        with:
          files: eve-strait.flatpak
