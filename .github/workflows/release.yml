name: Release

# Push a tag to build the Windows artifacts and publish a release:
#
#   git tag v0.1.0
#   git push origin v0.1.0
#
# Tags only, deliberately. A Nuitka compile plus an installer build is minutes
# of CI, and "Read version from the tag" would pick up a branch name on any
# other trigger.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write   # needed to create the GitHub Release

jobs:
  release:
    name: Build and publish Windows artifacts
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Read version from the tag
        id: ver
        shell: pwsh
        run: |
          $v = "${{ github.ref_name }}" -replace '^v',''
          if (-not $v) { $v = "0.0.0" }
          "version=$v" | Out-File $env:GITHUB_OUTPUT -Append

      # Stamp the tag into __init__.py and pyproject BEFORE pip install and
      # before Nuitka. Skipping this is how a v0.2.0 build kept reporting
      # 0.1.0, which made the updater offer an update to the running build.
      - name: Stamp the version
        shell: pwsh
        run: |
          # Read the version back through the same script rather than
          # grepping the file from an inline python -c: the nested quoting
          # needed to match "x.y.z" inside a YAML block scalar does not
          # survive, which is how this step first shipped broken.
          python scripts/version.py ${{ steps.ver.outputs.version }}
          $got = (python scripts/version.py).Trim()
          if ($got -ne "${{ steps.ver.outputs.version }}") {
            throw "stamp failed: file says '$got', tag says '${{ steps.ver.outputs.version }}'"
          }
          Write-Host "stamped OK: $got"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install PySide6 requests nuitka zstandard ordered-set
          python -m pip install .

      # Keyed on uv.lock, not pyproject.toml: the "Stamp the version" step
      # above rewrites pyproject.toml's version field before this runs, which
      # means every single tagged release hashed to a different key and this
      # cache was never actually being reused release to release -- only
      # ever a same-run coincidence via restore-keys' prefix fallback, and
      # each release was quietly saving its own multi-GB copy of the cache
      # under a key nothing would ever ask for again, which is exactly the
      # kind of thing that fills the repo's cache quota and starts evicting
      # the entries that do matter. uv.lock is never written to during this
      # workflow (pip install ., not uv sync), so its hash is stable across
      # releases that do not actually change a dependency.
      - name: Cache Nuitka compilation cache
        uses: actions/cache@v4
        with:
          path: ~/AppData/Local/Nuitka/Nuitka/Cache
          key: nuitka-${{ runner.os }}-${{ hashFiles('uv.lock') }}
          restore-keys: nuitka-${{ runner.os }}-

      # --standalone, never --onefile: a self-extracting single exe unpacks to
      # %TEMP% and runs itself, which Defender and CrowdStrike flag as dropper
      # behaviour. A plain program folder does not, and it is also what makes
      # the in-app updater possible.
      - name: Build (Nuitka standalone)
        run: >
          python -m nuitka
          --standalone
          --enable-plugin=pyside6
          --include-package=eve_strait
          --windows-console-mode=disable
          --assume-yes-for-downloads
          --company-name=Eve-Strait
          --product-name=Eve-Strait
          --file-version=${{ steps.ver.outputs.version }}
          --product-version=${{ steps.ver.outputs.version }}
          --file-description="EVE Online capital jump route planner"
          --copyright=Eve-Strait
          --windows-icon-from-ico=dist_assets/win/eve-strait.ico
          --include-package-data=eve_strait
          --output-dir=out
          --output-filename=eve-strait.exe
          app.py

      - name: Verify the built package reports the tag version
        shell: pwsh
        run: |
          $v = python -c "import eve_strait; print(eve_strait.__version__)"
          if ($v.Trim() -ne "${{ steps.ver.outputs.version }}") {
            throw "version mismatch: package says '$v', tag says '${{ steps.ver.outputs.version }}'"
          }
          Write-Host "version OK: $v"

      # Rust ships on windows-latest, so this needs no toolchain setup step.
      # Fatal if it fails: a published build must carry update.exe, or every
      # install it reaches falls back to the PowerShell path that a machine
      # execution policy can block.
      - name: Build the updater (update.exe)
        shell: pwsh
        run: |
          cargo build --release --manifest-path updater\Cargo.toml
          if ($LASTEXITCODE -ne 0) { throw "cargo build failed" }
          if (-not (Test-Path updater\target\release\update.exe)) {
            throw "cargo reported success but produced no update.exe"
          }

      - name: Stage the program folder
        shell: pwsh
        run: |
          $dist = Get-ChildItem out -Directory -Filter *.dist | Select-Object -First 1
          if (-not $dist) { throw "Nuitka produced no program folder" }
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item $dist.FullName dist\Eve-Strait -Recurse
          Copy-Item updater\target\release\update.exe dist\Eve-Strait -Force

      # The updater looks for a *-win*.zip asset, so keep "win" in the name.
      - name: Zip the portable build
        shell: pwsh
        run: |
          Compress-Archive -Path dist\Eve-Strait `
            -DestinationPath dist\Eve-Strait-${{ steps.ver.outputs.version }}-win64.zip

      - name: Build the installer
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            choco install innosetup -y --no-progress
            # Do not assume where choco put it.
            $iscc = (Get-ChildItem "${env:ProgramFiles(x86)}", $env:ProgramFiles `
                       -Filter ISCC.exe -Recurse -ErrorAction SilentlyContinue |
                     Select-Object -First 1).FullName
          }
          if (-not $iscc) { throw "Inno Setup compiler (ISCC.exe) not found" }
          & $iscc /DAppVersion=${{ steps.ver.outputs.version }} `
            dist_assets\win\eve-strait.iss
          if ($LASTEXITCODE -ne 0) { throw "ISCC failed with $LASTEXITCODE" }

      - name: Show what will be released
        shell: pwsh
        run: Get-ChildItem dist -File | Select-Object Name, Length | Format-Table

      # Published, not a draft. A draft is invisible to anyone not logged in as
      # a maintainer, and the in-app updater reads /releases/latest, which
      # skips drafts and prereleases entirely.
      - uses: softprops/action-gh-release@v2
        with:
          draft: false
          generate_release_notes: true
          files: |
            dist/Eve-Strait-*-win64.zip
            dist/Eve-Strait-*-setup.exe
