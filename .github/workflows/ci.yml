name: CI

# Nothing ran on a push to main before this: release.yml is deliberately
# tags-only (see its own comment), and the "Push on main" entries visible in
# the Actions tab are GitHub's own default CodeQL scan, not a build check --
# a security signal, not "does this still work".
#
# This is a fast, honest sanity gate, not a substitute for real testing: it
# byte-compiles the package and confirms every module actually imports.
# Eve-Strait has no test suite committed to the repo yet -- the regression
# checks used during development are ad hoc scripts, not a tracked `tests/`
# directory -- so this cannot and does not claim to run them.
on:
  push:
    branches: [main]

jobs:
  sanity:
    name: Compile and import
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install .

      - name: Byte-compile
        run: python -m compileall -q src

      - name: Import sanity
        run: python -c "import eve_strait; print(eve_strait.__version__)"
