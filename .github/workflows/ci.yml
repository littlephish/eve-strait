name: CI

# Nothing ran on a push to main before this: release.yml is deliberately
# tags-only (see its own comment), and the "Push on main" entries visible in
# the Actions tab are GitHub's own default CodeQL scan, not a build check --
# a security signal, not "does this still work".
#
# This is a fast sanity gate: it byte-compiles the package, confirms every
# module imports, and runs the unit tests. The suite is pure logic -- routing
# rules, wormhole handling, ESI transport, packaging asset consistency -- with
# no Qt and no network, because that is the part where a silent off-by-one is
# invisible when running the app. Everything UI is still verified by hand.
#
# Both Windows and Linux: the app is heading for a Flatpak, and the suite is
# platform-independent, so a Linux regression should fail here rather than in
# a Flatpak build that takes minutes.
#
# Most of the suite is pure logic, but not all of it: test_tasks.py and
# test_heat_layer.py import PySide6, which on a bare runner cannot even load
# without libEGL. They are installed below and the tests run headless, rather
# than being skipped -- a Qt import that fails on Linux is exactly the class
# of problem a Flatpak build would hit, and it should surface in the fast
# gate.
on:
  push:
    branches: [main]

jobs:
  sanity:
    name: Compile and import
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # PySide6 links against these; without libEGL the import fails before
      # any Qt platform plugin is even chosen, offscreen included.
      - name: Qt runtime libraries (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends libegl1 libgl1 libxkbcommon0 libdbus-1-3

      - name: Install
        shell: bash
        run: |
          python -m pip install --upgrade pip
          python -m pip install .

      - name: Byte-compile
        shell: bash
        run: python -m compileall -q src

      - name: Import sanity
        shell: bash
        run: python -c "import eve_strait; print(eve_strait.__version__)"

      - name: Unit tests
        shell: bash
        env:
          # No display on either runner. The Qt-touching tests build widgets,
          # so they need a platform plugin that does not want one.
          QT_QPA_PLATFORM: offscreen
        run: |
          python -m pip install pytest
          python -m pytest -q
