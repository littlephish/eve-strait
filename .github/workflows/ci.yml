name: CI

# Nothing ran on a push to main before this: release.yml is deliberately
# tags-only (see its own comment), and the "Push on main" entries visible in
# the Actions tab are GitHub's own default CodeQL scan, not a build check --
# a security signal, not "does this still work".
#
# This is a fast sanity gate: it byte-compiles the package, confirms every
# module imports, and runs the unit tests. The suite covers the ESI transport
# layer only (rate-limit maths, cache expiry) -- logic where a silent
# off-by-one is invisible when running the app. Everything else is still
# verified by hand.
on:
  push:
    branches: [main]

jobs:
  sanity:
    name: Compile and import
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install .

      - name: Byte-compile
        run: python -m compileall -q src

      - name: Import sanity
        run: python -c "import eve_strait; print(eve_strait.__version__)"

      - name: Unit tests
        run: |
          python -m pip install pytest
          python -m pytest -q
